<h1 id="ti">رقمك، حكمتك</h1>
<p class="sub" id="sb">اكتب أي رقم، وتظهر لك مقولة فلسفية. الرقم نفسه يعطيك المقولة نفسها دائماً.</p>
<div class="oracle"><label for="num" id="lb">همسُ رقم</label>
<input id="num" type="text" inputmode="decimal" autocomplete="off" placeholder="٧" aria-label="رقمك">
</div>
<div class="field">
<button class="go" id="go">استنطِق</button>
</div>
<button class="ghost" id="rnd">دع المصادفة تختار</button>
<div id="out" aria-live="polite"></div>
<p class="foot" id="ft">الصياغة العربية للأقوال تقريبية، والنسبة إلى أصحابها بحسب ما اشتهر عنهم.</p>
</div>
<script>
var Q=[
["لا أعلم إلا أنني لا أعلم شيئاً","سقراط","تعبير عن التواضع المعرفي: من أدرك حدود علمه ازداد بحثاً وسؤالاً. ومن هنا عُدّ الاعتراف بالجهل بداية الحكمة."],
["الحياة التي لا تُمتحَن لا تستحق أن تُعاش","سقراط","التأمّل في أفكارنا وأفعالنا هو ما يجعل الحياة حياة بحق."],
["أنا أفكّر، إذن أنا موجود","ديكارت","حتى لو شككت في كل شيء، فالشكّ نفسه دليل على وجود من يشكّ."],
["لا يمكنك أن تنزل النهر الواحد مرتين","هيراقليطس","كل شيء يتغيّر: النهر، والنازل فيه معاً."],
["الدهشة هي أصل الفلسفة","أفلاطون","نبدأ التفكير حين نكفّ عن اعتبار العالم أمراً مفروغاً منه."],
["الإنسان مدنيّ بطبعه","أرسطو","لا نكتمل إلا بين الناس."],
["الحق لا يضادّ الحق، بل يوافقه ويشهد له","ابن رشد","الحقيقة لا تناقض نفسها، مهما اختلفت الطرق إليها."],
["الظلم مؤذِنٌ بخراب العمران","ابن خلدون","المجتمعات تنهار حين يغيب العدل."],
["مَن كان له لماذا يعيش، احتمل أيَّ كيف تقريباً","نيتشه","المعنى يمنحنا القدرة على احتمال الصعاب."],
["تجرّأ على استخدام عقلك","كانط","النضج الفكري أن تفكّر بنفسك لا أن يُفكَّر عنك."],
["للقلب أسباب لا يعرفها العقل","باسكال","ليس كل ما نؤمن به نتيجة حساب."],
["حدود لغتي هي حدود عالمي","فتغنشتاين","ما لا نجد له كلمات يصعب علينا أن نراه."],
["رحلة الألف ميل تبدأ بخطوة","لاو تزو","البداية أصعب ما في الطريق وأهمّه."],
["ليس الفقر في قلّة ما نملك، بل في كثرة ما نشتهي","سينيكا","الرضا ثروة لا تنقص."],
["لك سلطان على عقلك، لا على الأحداث الخارجية","ماركوس أوريليوس","تحكّم فيما بيدك، ودع ما سواه."],
["الإنسان محكوم عليه بأن يكون حراً","سارتر","لا عذر لنا في اختياراتنا، ولهذا نحمل مسؤوليتها."],
["لا ينبغي أن نستحيي من استحسان الحق واقتنائه من أين أتى","الكندي","يدعو إلى أخذ الحقيقة ممن جاءت منه دون تعصّب لثقافة أو شعب. قالها الكندي دفاعاً عن الانفتاح على فلسفة اليونان."],
["السعادة هي الخير الذي يُطلب لذاته لا لأجل شيء آخر","الفارابي","المال والصحة وسائل نطلبها لغيرها، أما السعادة فهي الغاية التي تستقر عندها رغباتنا."],
["العقل أعدل الأشياء قسمةً بين الناس","ديكارت","افتتح بها «مقال عن المنهج»: الناس يتساوون في أصل القدرة على التفكير، ويختلفون في حسن استعمالها."],
["لا تسخر ولا تحزن ولا تغضب، بل افهم","سبينوزا","يدعونا إلى مقابلة تصرفات البشر بالفهم قبل الحكم عليها، فمن أدرك الأسباب خفّ غضبه وحزنه."],
["الإنسان ذئبٌ لأخيه الإنسان","توماس هوبز","رأى أنه لولا سلطة تنظّم الحياة لعاش الناس في صراع دائم، ولهذا برّر قيام الدولة بعقد يتنازل فيه الناس عن بعض حريتهم مقابل الأمان."],
["يولد الإنسان حراً، وهو في كل مكان مكبّل بالأغلال","جان جاك روسو","افتتاحية «العقد الاجتماعي»، يتساءل فيها عن شرعية القيود التي تفرضها المجتمعات والحكومات على الأفراد."],
["من لا يعرف إلا جانبه من القضية، لا يعرف منها إلا القليل","جون ستيوارت ميل","لا يكفي أن نملك رأياً صحيحاً، بل ينبغي أن نعرف حجج مخالفينا. بهذا دافع ميل عن حرية التعبير."],
["بومة مينرفا لا تفتح جناحيها إلا عند الغسق","هيغل","يشبّه الفلسفة بطائر يطير بعد انقضاء النهار، أي إننا لا نفهم عصراً إلا بعد أن يكتمل."],
["الموهبة تصيب هدفاً لا يصيبه غيرك، والعبقرية تصيب هدفاً لا يراه غيرك","شوبنهاور","يفرّق بين من يتقن ما يراه الجميع، ومن يكشف ما لا يراه أحد."],
["الحياة لا تُفهم إلا إلى الوراء، لكنها تُعاش إلى الأمام","كيركيغارد","نعرف معنى الأحداث بعد وقوعها، لكننا مضطرون إلى الاختيار قبل أن تتضح الصورة."],
["ما لا يقتلني يزيدني قوة","نيتشه","ينظر إلى المحنة كفرصة لبناء القوة، لكنها لا تعني أن كل ألم نافع."],
["لا يولد المرء امرأة، بل يصبح كذلك","سيمون دو بوفوار","تقصد أن كثيراً من أدوار المرأة صنعها المجتمع والتربية، لا الطبيعة وحدها. وهي من أشهر عبارات الفكر النسوي."],
["ما لا تحبه لنفسك فلا تفعله بغيرك","كونفوشيوس","قاعدة أخلاقية تُعرف بالقاعدة الذهبية، تجعل ميزان التعامل مع الآخرين ما نرضاه لأنفسنا."],
["لا تضطرب الناس بالأشياء، بل بما يظنونه عنها","إبيكتيتوس","الأحداث بذاتها محايدة، وأحكامنا عليها هي ما يزعجنا. فإذا غيّرنا الحكم هدأت النفس."],
["الموت لا يعنينا، فما دمنا موجودين لا يوجد، وإذا وُجد لم نكن","أبيقور","يرى أن الخوف من الموت وهم، لأننا لا نلتقي به أبداً."],
["اكتفى الفلاسفة بتفسير العالم، والمهم هو تغييره","كارل ماركس","يدعو إلى ربط الفكر بالفعل. وهي من أشهر عبارات ماركس وأكثرها جدلاً."],
["العقل عبد للعواطف","ديفيد هيوم","يرى أن العاطفة هي التي تحدد أهدافنا، والعقل يدلّنا على الوسائل. وقد أثارت الفكرة جدلاً طويلاً."],
["الفضيلة وسطٌ بين رذيلتين","أرسطو","الشجاعة مثلاً وسط بين التهور والجبن. فالفضيلة عنده توازن بين طرفين مذمومين."],
["كل الناس يشتهون المعرفة بطبعهم","أرسطو","افتتح بها كتاب «ما بعد الطبيعة»، ورأى في حبّ الاستطلاع دافعاً فطرياً للتعلّم."],
["الإنسان ابن عوائده ومألوفه، لا ابن طبيعته ومزاجه","ابن خلدون","يرى أن سلوك الإنسان يتشكّل بما اعتاده في بيئته وتربيته أكثر مما يتشكّل بفطرته. ولهذا يختلف الناس باختلاف المجتمعات التي نشأوا فيها."],
["كل الناس يسعون بكل أفعالهم إلى طرد الهمّ","ابن حزم","فسّر ابن حزم تنوّع غايات البشر بغاية واحدة خلفها: الراحة من القلق. فالتاجر والعالم والمحارب يبحثون في النهاية عن طمأنينة النفس."],
["طالب الحق ليس من ينظر في كتب المتقدمين ويُحسن الظنّ بها، بل من يتّهم ظنّه بها","ابن الهيثم","يدعو الباحث إلى الشك في الآراء الموروثة حتى يختبرها بالدليل، حتى لو كانت لكبار العلماء. وهو روح المنهج العلمي."],
["لأن يُظلَم المرء خير من أن يَظلِم","سقراط","يرى سقراط أن الظلم يفسد نفس فاعله قبل أن يؤذي ضحيته. فالأخطر على الإنسان أن يصير ظالماً."],
["الإنسان مقياس كل شيء","بروتاغوراس","عبارة تلخّص النسبية: ما يراه كل إنسان حقاً يتأثر بمنظوره. وقد ردّ عليها أفلاطون وأرسطو طويلاً."],
["الطريق إلى أعلى والطريق إلى أسفل واحد","هيراقليطس","الشيء الواحد يختلف وصفه بحسب موقعنا منه، والأضداد مرتبطة ببعضها. فلا فهم للصعود دون الهبوط."],
["نحن نعاني في الخيال أكثر مما نعاني في الواقع","سينيكا","كثير من خوفنا مصدره توقّعات لم تقع. فتدريب الذهن على مواجهة الواقع يخفّف القلق."],
["ما يعترض الطريق يصبح هو الطريق","ماركوس أوريليوس","العقبة ليست نهاية الرحلة بل جزء منها، وكيف نتعامل معها يصنع فضيلتنا. وهي فكرة محورية في الرواقية."],
["المعرفة قوة","فرانسيس بيكون","كلما فهمنا قوانين الطبيعة صرنا أقدر على التحكم بها وتسخيرها. ومن هنا ربط بيكون العلم بالقدرة على الفعل."],
["عقل الإنسان في البدء صفحة بيضاء","جون لوك","يرى لوك أن الأفكار تأتي من التجربة لا من الفطرة. وبهذا فتح الباب لأهمية التربية والبيئة."],
["نحن نعيش في أفضل العوالم الممكنة","ليبنتز","حاول ليبنتز تفسير وجود الشر بأن الله اختار أحسن عالم ممكن. وقد سخر منها فولتير لاحقاً."],
["السماء المرصّعة بالنجوم فوقي، والقانون الأخلاقي في داخلي","كانط","يقف كانط مأخوذاً بأمرين: عظمة الكون، وإحساس الإنسان الداخلي بالواجب. وكلاهما يملأ النفس إجلالاً."],
["الشك حالة غير مريحة، لكن اليقين حالة سخيفة","فولتير","من يتيقن من كل شيء يتوقف عن التعلّم. فالشك المنهجي يتعب لكنه يحمينا من الغرور."],
["من يحارب الوحوش فليحذر أن يصير وحشاً","نيتشه","قد يشبه الإنسان خصمه إذا استعمل أساليبه. فالصراع مع الشر يحتاج إلى مراقبة النفس."],
["ينبغي أن نتخيّل سيزيف سعيداً","ألبير كامو","سيزيف محكوم عليه برفع صخرة تسقط دائماً، ومع ذلك يجد كامو في إصراره معنى. فالمعنى يصنعه من يواصل رغم العبث."],
["ثلاثة أهواء حكمت حياتي: الشوق إلى الحب، والبحث عن المعرفة، والشفقة على آلام البشرية","برتراند راسل","لخّص راسل في هذه العبارة ما جعل لحياته معنى. وهي دعوة لأن نجمع بين العاطفة والعقل والرحمة."],
["أن تعرف ما تعرف، وتعرف ما لا تعرف، فتلك هي المعرفة","كونفوشيوس","المعرفة الحقيقية تتضمن إدراك حدودها. فمن ظن أنه يعرف كل شيء أغلق باب التعلّم."],
["من يعرف الآخرين حكيم، ومن يعرف نفسه مستنير","لاو تزو","فهم الناس مهارة نافعة، لكن فهم النفس أعمق وأصعب. فالاستنارة تبدأ من الداخل."],
["ما لا نستطيع الكلام عنه يجب أن نصمت عنه","فتغنشتاين","خاتمة «رسالة منطقية فلسفية»: للغة حدود، وليس كل ما نحسّ به يمكن قوله بدقة."],
["السعادة غاية الغايات","أرسطو","نطلب المال والصحة والصداقة لأجل شيء آخر، أما السعادة فنطلبها لذاتها. ولهذا عدّها أرسطو الخير الأسمى."],
["لكي نبلغ الحقيقة، لا بد أن نشك مرة في حياتنا في كل الأشياء بقدر المستطاع","ديكارت","يقترح ديكارت أن نراجع كل ما نعتقده مرة واحدة على الأقل، لنبني معارفنا على أساس متين."],
["الإنسان الحر لا يفكّر في شيء أقل من الموت، وحكمته تأمّل في الحياة","سبينوزا","يرى أن الحكمة في أن نعيش حياتنا بوعي وفرح، لا أن نقضيها خوفاً من نهايتها."],
["من لم يشكّ لم ينظر، ومن لم ينظر لم يُبصر","أبو حامد الغزالي","يجعل الشكّ بداية الطريق إلى اليقين: فمن يقبل كل شيء دون فحص لا يرى الحقيقة بنفسه. وقد روى الغزالي رحلته من الشك إلى الطمأنينة في «المنقذ من الضلال»."],
["الأمل حلم اليقظان","أرسطو","الأمل صورة نبنيها في الذهن ونحن مستيقظون، فهو يدفعنا إلى العمل لا إلى الوهم. وتُنسب العبارة إلى أرسطو فيما نقله عنه المؤرخون."],
["من لا يستطيع العيش في مجتمع، أو لا حاجة له به لأنه مكتفٍ بنفسه، فهو إما وحش أو إله","أرسطو","يؤكد أرسطو أن الإنسان لا يكتمل وحده، فمن استغنى عن الناس تماماً خرج عن حدود الإنسانية. وهي من حجج كتابه «السياسة» على أن الإنسان اجتماعي بطبعه."],
["لا تطلب أن تجري الأمور كما تشتهي، بل اشتهِ أن تجري كما تجري، فتصفو حياتك","إبيكتيتوس","يدعو إلى قبول ما لا نملك تغييره، والتركيز فيما بأيدينا. وبهذا يتحول الاعتراض على الواقع إلى سكينة."],
["ليست الحياة قصيرة، بل نحن نضيّع الكثير منها","سينيكا","يرى أن المشكلة في كيف نصرف أوقاتنا لا في عدد السنين. وهي فكرة رسالته «في قِصَر الحياة»."],
["ما الزمن؟ إن لم يسألني أحد عرفته، وإن أردت أن أشرحه لسائل لم أعرف","أوغسطين","يعبّر عن حيرة الفلاسفة أمام الزمن: نعيشه في كل لحظة ثم نعجز عن تعريفه. وقد جاءت في كتابه «الاعترافات»."],
["كل مشاكل الإنسان تأتي من عجزه عن الجلوس هادئاً في غرفة وحده","باسكال","يرى أننا نهرب إلى الانشغال والتسلية كي لا نواجه أنفسنا. فالسكون هو الاختبار الحقيقي لراحتنا الداخلية."],
["أن تكون سقراط غير راضٍ خير من أن تكون أحمق راضياً","جون ستيوارت ميل","يرى أن لذّة الفكر أرفع من الرضا الساذج، حتى لو رافقها قلق. وهي من أشهر عبارات كتابه «النفعية»."],
["تصرّف بحيث تعامل الإنسانية، في شخصك وفي كل شخص، غاية لا وسيلة فحسب","كانط","لا يجوز استعمال البشر أدوات لتحقيق أهدافنا فقط، فلكل إنسان كرامة. وهي إحدى صيغ «الأمر المطلق» عند كانط."],
["القلق هو دوار الحرية","كيركيغارد","حين نقف أمام اختيارات مفتوحة نشعر بالدوار كمن ينظر من علوّ. فالقلق علامة على أننا أحرار."],
["الجحيم هو الآخرون","سارتر","جاءت على لسان شخصية في مسرحية «الباب المغلق». والمقصود أن نظرة الآخرين قد تحاصرنا وتفرض علينا صورة عن أنفسنا، لا أن الناس أشرار."],
["حلمتُ أنني فراشة، وحين استيقظت لم أعرف: هل أنا رجل حلم أنه فراشة، أم فراشة تحلم أنها رجل؟","تشوانغ تزو","يشكّك في الحدّ الفاصل بين الحلم واليقظة، وبين الحقيقة والوهم. وهي من أشهر قصص الفلسفة الصينية."],
["لا تحزن لأن الناس لا يعرفونك، بل لأنك لا تعرفهم","كونفوشيوس","ينقل الاهتمام من طلب التقدير إلى طلب الفهم. فمعرفة الناس أنفع للمرء من شهرته بينهم."],
["ماذا أعرف؟","ميشيل دو مونتين","شعار اتخذه ليذكّر نفسه بحدود علمه. وبهذا السؤال دافع عن الشك المعتدل والتواضع الفكري."],
["يجب أن يكون في داخلك فوضى لكي تستطيع أن تلد نجمة راقصة","نيتشه","الإبداع يحتاج إلى اضطراب داخلي يولّد شيئاً جديداً، فمن استقرّ تماماً لا يلد جديداً. المصدر: «هكذا تكلم زرادشت»، المقدمة، 5."],
["الإنسان حبل مشدود بين الحيوان والإنسان الأعلى، حبل فوق هاوية","نيتشه","صورة لوضع الإنسان: كائن في طريقه إلى تجاوز ذاته، وسيره خطر لأن تحته هاوية. المصدر: «هكذا تكلم زرادشت»، المقدمة، 4."],
["أعظم ما في الإنسان أنه جسر وليس غاية","نيتشه","قيمة الإنسان في أنه عبور نحو ما هو أعلى منه، لا في أنه نهاية المطاف. المصدر: «هكذا تكلم زرادشت»، المقدمة، 4."],
["اكتب بدمك، وستعرف أن الدم هو الروح","نيتشه","الكتابة الصادقة تخرج من التجربة المعاشة لا من النقل البارد. المصدر: «هكذا تكلم زرادشت»، الجزء الأول، «عن القراءة والكتابة»."],
["من دون موسيقى ستكون الحياة خطأً","نيتشه","يجعل الفن، والموسيقى خاصة، شرطاً لتكون الحياة محتملة وجميلة. المصدر: «شفق الأوثان»، «مواعظ وأسهم»، 33."],
["وحين تنظر طويلاً في الهاوية، فإن الهاوية تنظر فيك","نيتشه","تتمة الحكمة التي تحذّر من محاربة الوحوش: من يغرق في مواجهة الشر قد يتأثر به دون أن يشعر. المصدر: «ما وراء الخير والشر»، الفصل الرابع، 146."],
["الجنون نادر عند الأفراد، أما عند الجماعات والأحزاب والشعوب والعصور فهو القاعدة","نيتشه","ينبّه إلى أن الحشود قد تفقد رشدها وهي تظن نفسها على صواب. المصدر: «ما وراء الخير والشر»، الفصل الرابع، 156."],
["نحتاج أحياناً إلى استراحة من أنفسنا، بأن ننظر إليها من بعيد ونضحك أو نبكي عليها","نيتشه","النظر إلى الذات من مسافة، كما ينظر الفنان إلى لوحته، يخفف حدّتها ويساعد على فهمها. المصدر: «العلم المرح»، الفقرة 107."],
["لا نسكن بلداً، بل نسكن لغة","إميل سيوران","الوطن الحقيقي عنده هو اللغة التي نفكّر بها ونحلم، لا الأرض والحدود. وهو قول يعبّر عن تجربة سيوران نفسه، الروماني الذي كتب بالفرنسية. اشتُهر عنه في حواراته وكتاباته."],
["المتعصّب لا يُفسده شيء: من يقتل من أجل فكرة قادر أيضاً أن يموت من أجلها، وهو في الحالين وحش","إميل سيوران","يرى أن التعصب لا يعرف حداً: من تمسّك بفكرة دون شك صار مستعداً للقتل وللموت من أجلها. المصدر: «موجز التحلّل»."],
["ينبغي للكتاب أن ينكأ الجراح، بل أن يُحدث جراحاً، وأن يكون خطراً","إميل سيوران","يرى أن الكتاب الذي لا يزعج القارئ ولا يهزّ يقينه لا قيمة له. يُنسب إليه ضمن أقواله المنشورة."]
